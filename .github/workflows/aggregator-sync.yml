name: Launchpad Aggregator Sync

on:
  workflow_dispatch:
  schedule:
    # 10:15 UTC daily = 2:15 AM PST / 3:15 AM PDT
    - cron: '15 10 * * *'

permissions:
  contents: read

# The aggregator and ATS jobs are independent: neither lists the other in `needs`,
# each has its own timeout, and a failure or timeout in one cannot skip the other.
jobs:
  aggregators:
    name: Aggregator ingestion and fallback verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: launchpad-aggregator-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ingest aggregator feeds, then verify jobs the feeds missed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          AGGREGATOR_VERIFY_BUDGET_MINUTES: '45'
        run: npx tsx scripts/sync-all-sources.ts --aggregators-only

  ats:
    name: ATS company boards
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: launchpad-ats-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sync company boards and confirm employer listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sync-all-sources.ts --ats-only
